<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - RentEase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            RentEase
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="properties.html">Properties</a>
            <a href="#">How It Works</a>
            <a href="#">About</a>
        </div>

        <div class="nav-buttons">

            <a href="login.html" class="nav-login">
                Login
            </a>

            <a href="signup.html" class="nav-signup">
                Sign Up
            </a>

        </div>

    </nav>


    <!-- SIGNUP SECTION -->

    <main class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join RentEase today
            </p>


            <form id="signupForm">

                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                    >

                </div>


                <div class="form-group">

                    <label for="userRole">
                        I am a
                    </label>

                    <select id="userRole">

                        <option value="">
                            Select role
                        </option>

                        <option value="tenant">
                            Tenant
                        </option>

                        <option value="owner">
                            Property Owner
                        </option>

                    </select>

                </div>


                <button type="submit" class="auth-btn">
                    Create Account
                </button>

                <p id="signupMessage"></p>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
